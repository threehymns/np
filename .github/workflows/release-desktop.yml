name: release-desktop

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Prerelease identifiers follow semver: purely numeric ones must not
          # carry leading zeroes (v1.2.3-01 is invalid); identifiers containing
          # a letter or hyphen are unrestricted.
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' is not a semantic version tag such as v1.2.3."
            exit 1
          fi

          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "HEAD^{commit}" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag '$RELEASE_TAG' points to a commit that is not on '$DEFAULT_BRANCH'. Release from the default branch only."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test

      - name: Run type and lint checks
        run: bun run check

      - name: Build web and desktop apps
        run: bun run build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            artifact: linux-x64
          - os: windows-latest
            arch: x64
            artifact: windows-x64
          - os: macos-15-intel
            arch: x64
            artifact: macos-x64
          - os: macos-15
            arch: arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun --filter desktop set-version

      - name: Build desktop app
        run: bun run build:desktop

      - name: Package desktop app (Linux)
        if: runner.os == 'Linux'
        run: bun --filter desktop dist:${{ matrix.arch }}

      - name: Package desktop app (macOS)
        if: runner.os == 'macOS'
        run: bun --filter desktop dist:${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package desktop app (Windows)
        if: runner.os == 'Windows'
        run: bun --filter desktop dist:${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: np-${{ matrix.artifact }}
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
          if-no-files-found: error

      - name: Upload macOS installers
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: np-${{ matrix.artifact }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: np-${{ matrix.artifact }}
          path: apps/desktop/dist-electron/*.exe
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Classify the release as stable or prerelease
        run: |
          # Semver marks a prerelease with a hyphen in the version core, before
          # any '+' build metadata: 'v1.2.3-rc.1' is a prerelease, but
          # 'v1.2.3+build-5' is stable.
          version_core="${GITHUB_REF_NAME%%+*}"
          if [[ "$version_core" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
